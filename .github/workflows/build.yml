name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project RizzKB.xcodeproj \
            -scheme RizzKB \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/RizzKB.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RizzKB.app Payload/
          ls Payload/RizzKB.app/PlugIns
          zip -qry RizzKB.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RizzKB-ipa
          path: RizzKB.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
